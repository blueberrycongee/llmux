# LLMux Gateway - Local Development Configuration
# Uses real DeepSeek provider via environment variable.
# Before starting the gateway in your shell, set:
#   $env:DEEPSEEK_API_KEY="<your-real-key>"

server:
  port: 8080
  admin_port: 8081
  read_timeout: 30s
  write_timeout: 120s
  idle_timeout: 60s

deployment:
  mode: development

providers:
  - name: deepseek-primary
    type: deepseek
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    models:
      - deepseek-chat
      - deepseek-reasoner
    max_concurrent: 32
    timeout: 90s

routing:
  default_provider: deepseek-primary
  strategy: lowest-latency
  fallback_enabled: true
  retry_count: 2
  cooldown_period: 45s

rate_limit:
  enabled: false
  fail_open: true

logging:
  level: info
  format: json

metrics:
  enabled: true
  path: /metrics

tracing:
  enabled: false

observability:
  enabled_callbacks: []

pricing_file: ./config/local.pricing.json

mcp:
  enabled: true
  default_connection_timeout: 15s
  default_execution_timeout: 60s
  clients:
    - id: filesystem
      name: Filesystem MCP
      type: stdio
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-filesystem"
        - C:\\Users\\1\\Desktop\\go_code\\llmux
      tools_to_execute:
        - "*"

    - id: fetch
      name: Fetch MCP
      type: stdio
      command: uvx
      args:
        - mcp-server-fetch
      tools_to_execute:
        - "*"

    # - id: playwright
    #   name: Playwright MCP
    #   type: stdio
    #   command: npx
    #   args:
    #     - -y
    #     - '@playwright/mcp@latest'
    #   tools_to_execute:
    #     - "*"

    # - id: github
    #   name: GitHub MCP
    #   type: stdio
    #   command: npx
    #   args:
    #     - -y
    #     - '@modelcontextprotocol/server-github'
    #   envs:
    #     - GITHUB_TOKEN=${GITHUB_TOKEN}
    #   tools_to_execute:
    #     - "*"

auth:
  enabled: false
  skip_paths:
    - /health/ready
    - /health/live
    - /metrics

cors:
  enabled: true
  allow_all_origins: false
  allow_credentials: false
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Content-Type
    - Authorization
    - Accept-Language
    - X-LLMux-Locale
  expose_headers: []
  max_age: 10m
  data_origins:
    allowlist:
      - http://localhost:3000
      - http://localhost:3001
    denylist: []
  admin_origins:
    allowlist:
      - http://localhost:3000
      - http://localhost:3001
    denylist: []
  admin_path_prefixes:
    - /sandbox
    - /key
    - /team
    - /user
    - /organization
    - /spend
    - /global
    - /audit
    - /invitation
    - /control
    - /auth
    - /ui
